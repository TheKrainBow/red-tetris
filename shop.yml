version: 1.1
game:
  resources:
    - id: dirt
      display_name: Dirt
      type: collectible
    - id: stone
      display_name: Stone
      type: collectible
    - id: iron
      display_name: Iron
      type: collectible
    - id: diamond
      display_name: Diamond
      type: collectible
    - id: emerald
      display_name: Emerald
      type: trade_only

  spawn_probabilities_start:
    dirt: 1.0
    stone: 0.0
    iron: 0.0
    diamond: 0.0

shops:
  - id: stone_spawn_rate
    name: "Rock detector"
    icon: "/ui/shop/rock_detector.png"
    effect_type: spawn_rate_increase
    affects: stone
    resource_cost: dirt
    starting_price: 25
    price_growth_multiplier: 1.15
    effect_per_level: 0.01
    effect_growth_multiplier: 1.0
    max_level: 100

  - id: dirt_line_break_bonus
    name: "Dirt Expert"
    icon: "/ui/shop/dirt_expert.png"
    effect_type: line_break_bonus
    affects: dirt
    resource_cost: stone
    starting_price: 5
    price_growth_multiplier: 1.40
    effect_base: 1
    effect_growth_multiplier: 1.30
    max_level: 50

  - id: iron_spawn_rate
    name: "Iron detector"
    icon: "/ui/shop/iron_detector.png"
    effect_type: spawn_rate_increase
    affects: iron
    resource_cost: stone
    starting_price: 25
    price_growth_multiplier: 1.17
    effect_per_level: 0.01
    effect_growth_multiplier: 1.0
    max_level: 100

  - id: stone_line_break_bonus
    name: "Stone Expert"
    icon: "/ui/shop/stone_expert.png"
    effect_type: line_break_bonus
    affects: stone
    resource_cost: iron
    starting_price: 5
    price_growth_multiplier: 1.50
    effect_base: 1
    effect_growth_multiplier: 1.25
    max_level: 50

  - id: diamond_spawn_rate
    name: "Diamond detector"
    icon: "/ui/shop/diamond_detector.png"
    effect_type: spawn_rate_increase
    affects: diamond
    resource_cost: iron
    starting_price: 25
    price_growth_multiplier: 1.20
    effect_per_level: 0.01
    effect_growth_multiplier: 1.0
    max_level: 100

  - id: iron_line_break_bonus
    name: "Iron Expert"
    icon: "/ui/shop/iron_expert.png"
    effect_type: line_break_bonus
    affects: iron
    resource_cost: diamond
    starting_price: 5
    price_growth_multiplier: 1.55
    effect_base: 1
    effect_growth_multiplier: 1.23
    max_level: 50

trades:
  # Basic resource -> Emerald exchanges
  - id: dirt_to_emerald
    name: "128 Dirt → 1 Emerald"
    requires: []
    give:
      emerald: 1
    cost:
      dirt: 128

  - id: stone_to_emerald
    name: "64 Stone → 1 Emerald"
    requires: []
    give:
      emerald: 1
    cost:
      stone: 64

  - id: iron_to_emerald
    name: "32 Iron → 1 Emerald"
    requires: []
    give:
      emerald: 1
    cost:
      iron: 32

  - id: diamond_to_emerald
    name: "16 Diamond → 1 Emerald"
    requires: []
    give:
      emerald: 1
    cost:
      diamond: 16

  # Battle pass unlocked reverse trades (emerald -> resource)
  - id: emerald_to_dirt
    name: "1 Emerald → 128 Dirt"
    requires:
      - dirt_battle_pass
    give:
      dirt: 128
    cost:
      emerald: 1

  - id: emerald_to_stone
    name: "1 Emerald → 64 Stone"
    requires:
      - stone_battle_pass
    give:
      stone: 64
    cost:
      emerald: 1

  - id: emerald_to_iron
    name: "1 Emerald → 32 Iron"
    requires:
      - iron_battle_pass
    give:
      iron: 32
    cost:
      emerald: 1

  - id: emerald_to_diamond
    name: "1 Emerald → 16 Diamond"
    requires:
      - diamond_battle_pass
    give:
      diamond: 16
    cost:
      emerald: 1

crafts:
  # Placeholder craft for now; effects can be filled later
  - id: fortune_enchant
    name: "Fortune Enchantment"
    icon: "/ui/shop/fortune_enchantment.png"
    cost:
      dirt: 300
      stone: 120
      iron: 60
      diamond: 24
    outputs:
      fortune_enchant: 1
    effects:
      fortune_multiplier_percent: 200
    max_crafts: 3
    craft_time_seconds: 0
  - id: bonus_multiplayer
    name: "Duplication Glitch"
    icon: "/ui/shop/duplication_glitch.png"
    cost:
      dirt: 10000
      stone: 10000
      iron: 10000
      diamond: 10000
    outputs:
